[package]
name = "github-audit-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Tools for auditing GitHub enterprises: repositories, people, advisories, and Actions storage."
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env", "wrap_help"] }
futures = "0.3.33"
# tac-eligibility hashes logins the way the election page does.
md5 = "0.8.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
# gh-actions-storage parses GitHub's RFC 3339 timestamps; tac-eligibility
# stamps cache rows with the local date.
time = { version = "0.3", features = ["parsing", "formatting", "local-offset"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = true
strip = true
