[package]
name = "gh-actions-storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rank and purge GitHub Actions artifact storage across an enterprise, organization, or repository."
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = true
strip = true
